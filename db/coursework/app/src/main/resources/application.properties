spring.application.name=micromobility

# MySQL (the compose service "db"); times are UTC in the database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:micromobility}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${DB_USER:micromobility}
spring.datasource.password=${DB_PASSWORD:micromobility}

# Flyway owns the DDL (V1 schema, V2 seed); Hibernate only checks that the mapping fits the tables
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Fixed locale: numbers and dates look the same for every browser
spring.web.locale=uk_UA
spring.web.locale-resolver=fixed
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.cache=false
