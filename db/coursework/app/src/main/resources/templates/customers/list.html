<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Клієнти')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container my-4">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Клієнти</h1>
        <a class="btn btn-primary" th:href="@{/customers/new}">Додати клієнта</a>
    </div>
    <form class="row g-2 mb-3" method="get" th:action="@{/customers}">
        <div class="col-auto"><input class="form-control" name="q" th:value="${q}" placeholder="Початок прізвища"></div>
        <div class="col-auto"><button class="btn btn-outline-primary">Знайти</button></div>
    </form>
    <table class="table table-sm table-striped">
        <thead><tr><th>№</th><th>Прізвище, імʼя</th><th>Телефон</th><th>E-mail</th><th>Дія</th><th class="text-end">Баланс, грн</th><th></th></tr></thead>
        <tbody>
        <tr th:each="c : ${customers}" class="data-row">
            <td th:text="${c.id}"></td><td th:text="${c.fullName()}"></td><td th:text="${c.phone}"></td>
            <td th:text="${c.email}"></td>
            <td>
                <span th:if="${c.verified()}" th:text="${@fmt.dt(c.diiaVerifiedAt)}"></span>
                <form th:unless="${c.verified()}" class="d-inline" method="post" th:action="@{/customers/{id}/verify(id=${c.id})}">
                    <button class="btn btn-sm btn-outline-success">Підтвердити через Дію</button>
                </form>
            </td>
            <td class="text-end" th:text="${@fmt.uah(c.balanceKop)}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/payments(customerId=${c.id})}">Гаманець</a>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/customers/{id}/edit(id=${c.id})}">Змінити</a>
                <form class="d-inline" method="post" th:action="@{/customers/{id}/delete(id=${c.id})}" onsubmit="return confirm('Видалити клієнта?')">
                    <button class="btn btn-sm btn-outline-danger">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
