<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Клієнт')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container my-4" style="max-width: 640px">
    <h1 class="h4" th:text="${form.id == null} ? 'Новий клієнт' : 'Клієнт №' + ${form.id}">Клієнт</h1>
    <p class="text-muted small" th:if="${form.id == null}">Новий клієнт одразу отримує бонус 200 грн. Підтвердження через Дію виконується окремою кнопкою у списку.</p>
    <form method="post" th:action="@{/customers/save}" th:object="${form}">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        <input type="hidden" th:field="*{id}">
        <div class="mb-3"><label class="form-label">Прізвище</label>
            <input class="form-control" th:field="*{lastName}"><div class="text-danger small" th:errors="*{lastName}"></div></div>
        <div class="mb-3"><label class="form-label">Імʼя</label>
            <input class="form-control" th:field="*{firstName}"><div class="text-danger small" th:errors="*{firstName}"></div></div>
        <div class="mb-3"><label class="form-label">Телефон</label>
            <input class="form-control" th:field="*{phone}" placeholder="+380991234567"><div class="text-danger small" th:errors="*{phone}"></div></div>
        <div class="mb-3"><label class="form-label">E-mail (необов'язково)</label>
            <input class="form-control" th:field="*{email}"><div class="text-danger small" th:errors="*{email}"></div></div>
        <button class="btn btn-primary" type="submit">Зберегти</button>
        <a class="btn btn-link" th:href="@{/customers}">Назад</a>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
