<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Поїздка')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container my-4" style="max-width: 760px">
    <div th:replace="~{fragments :: flash}"></div>
    <h1 class="h4" th:text="${receipt.ride.active} ? 'Поїздка №' + ${receipt.ride.id} + ' (триває)' : 'Квитанція про поїздку №' + ${receipt.ride.id}">Поїздка</h1>
    <table class="table table-sm">
        <tr><th style="width: 40%">Клієнт</th><td th:text="${receipt.ride.customer.fullName}"></td></tr>
        <tr><th>Транспорт</th><td th:text="${receipt.ride.vehicle.code + ', ' + receipt.ride.vehicle.model + ', ' + receipt.ride.vehicle.vehicleType.label}"></td></tr>
        <tr><th>Оператор</th><td th:text="${receipt.ride.vehicle.operator.name}"></td></tr>
        <tr><th>Початок (Київ)</th><td th:text="${@fmt.dt(receipt.ride.startedAt)}"></td></tr>
        <tr><th>Кінець (Київ)</th><td th:text="${receipt.ride.active} ? 'триває' : ${@fmt.dt(receipt.ride.endedAt)}"></td></tr>
        <tr><th>Тариф на момент початку</th><td th:text="${@fmt.uah(receipt.ride.unlockFeeKop) + ' грн розблокування + ' + @fmt.uah(receipt.ride.perMinuteKop) + ' грн за хвилину'}"></td></tr>
        <tr th:unless="${receipt.ride.active}"><th>Оплачено хвилин</th><td th:text="${receipt.minutes}"></td></tr>
        <tr th:if="${receipt.chargeKop != null}"><th>Списано</th><td th:text="${@fmt.uah(receipt.chargeKop) + ' грн'}"></td></tr>
        <tr th:if="${receipt.refundKop != null}"><th>Повернено</th><td th:text="${@fmt.uah(receipt.refundKop) + ' грн'}"></td></tr>
    </table>

    <div th:if="${receipt.ride.active}" class="card mb-3"><div class="card-body">
        <h2 class="h6">Станція, де залишено транспорт</h2>
        <form method="post" class="row g-2">
            <div class="col-12"><select class="form-select" name="stationId" required>
                <option value="">Оберіть станцію...</option>
                <option th:each="s : ${stations}" th:value="${s.id}" th:disabled="${s.free() <= 0}"
                        th:text="${s.name + ' (вільно ' + s.free() + ' з ' + s.capacity + ')'}"></option>
            </select></div>
            <div class="col-12">
                <button class="btn btn-success" th:formaction="@{/rides/{id}/finish(id=${receipt.ride.id})}">Завершити поїздку</button>
                <button class="btn btn-outline-danger" th:formaction="@{/rides/{id}/cancel(id=${receipt.ride.id})}"
                        onclick="return confirm('Скасувати поїздку без оплати?')">Скасувати без оплати</button>
            </div>
        </form>
    </div></div>

    <div th:if="${receipt.refundableKop() != null}" class="card mb-3"><div class="card-body">
        <h2 class="h6">Повернення коштів (від 0,01 грн до суми списання, один раз)</h2>
        <form method="post" class="row g-2" th:action="@{/rides/{id}/refund(id=${receipt.ride.id})}">
            <div class="col-auto"><input class="form-control" type="number" step="0.01" min="0.01" name="amount" required
                                         th:max="${@fmt.uahInput(receipt.refundableKop())}" th:value="${@fmt.uahInput(receipt.refundableKop())}"></div>
            <div class="col-auto"><button class="btn btn-warning">Повернути</button></div>
        </form>
    </div></div>
    <a th:href="@{/rides}">До списку поїздок</a>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
