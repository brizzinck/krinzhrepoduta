<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('R5')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container my-4">
    <h1 class="h4">R5. Оператори і типи транспорту (зведена таблиця)</h1>
    <form class="row g-2 mb-3" method="get" th:action="@{/reports/r5}">
        <div class="col-auto"><label class="form-label small mb-0">Початок з</label><input class="form-control" type="date" name="from" th:value="${from}"></div>
        <div class="col-auto"><label class="form-label small mb-0">Початок по (включно)</label><input class="form-control" type="date" name="to" th:value="${to}"></div>
        <div class="col-auto align-self-end"><button class="btn btn-outline-primary">Показати</button></div>
    </form>
    <p class="text-muted">Знайдено рядків: <span id="row-count" th:text="${#lists.size(rows)}">0</span>. Завершені поїздки; середня тривалість у оплачених хвилинах.</p>
    <table class="table table-sm table-striped">
        <thead><tr><th rowspan="2">Оператор</th><th colspan="2" class="text-center">Електросамокат</th><th colspan="2" class="text-center">Електровелосипед</th><th rowspan="2" class="text-end">Усього поїздок</th></tr>
            <tr><th class="text-end">Поїздок</th><th class="text-end">Середня, хв</th><th class="text-end">Поїздок</th><th class="text-end">Середня, хв</th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}" class="data-row" th:data-v="${(r.isTotal == 1 ? 'NULL' : r.operator) + '|' + r.isTotal + '|' + r.scooterRides + '|' + (r.scooterAvgMin ?: 'NULL') + '|' + r.bikeRides + '|' + (r.bikeAvgMin ?: 'NULL') + '|' + r.totalRides}" th:classappend="${r.isTotal == 1} ? 'fw-bold table-secondary'">
            <td th:text="${r.isTotal == 1} ? 'Усього' : ${r.operator}"></td>
            <td class="text-end" th:text="${r.scooterRides}"></td><td class="text-end" th:text="${@fmt.dec(r.scooterAvgMin)}"></td>
            <td class="text-end" th:text="${r.bikeRides}"></td><td class="text-end" th:text="${@fmt.dec(r.bikeAvgMin)}"></td>
            <td class="text-end" th:text="${r.totalRides}"></td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
