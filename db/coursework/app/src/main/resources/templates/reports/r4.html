<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('R4')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container my-4">
    <h1 class="h4">R4. Клієнти з найбільшими витратами</h1>
    <form class="row g-2 mb-3" method="get" th:action="@{/reports/r4}">
        <div class="col-auto"><label class="form-label small mb-0">Завершення з</label><input class="form-control" type="date" name="from" th:value="${from}"></div>
        <div class="col-auto"><label class="form-label small mb-0">Завершення по (включно)</label><input class="form-control" type="date" name="to" th:value="${to}"></div>
        <div class="col-auto"><label class="form-label small mb-0">Поїздок не менше</label><input class="form-control" type="number" min="1" name="minRides" th:value="${minRides}"></div>
        <div class="col-auto align-self-end"><button class="btn btn-outline-primary">Показати</button></div>
    </form>
    <p class="text-muted">Знайдено: <span id="row-count" th:text="${#lists.size(rows)}">0</span>. Витрати = списання мінус повернення, не більше п'яти клієнтів.</p>
    <table class="table table-sm table-striped">
        <thead><tr><th>Клієнт</th><th class="text-end">Поїздок</th><th class="text-end">Витрачено, грн</th><th class="text-end">Середня поїздка, грн</th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}" class="data-row" th:data-v="${r.id + '|' + r.rides + '|' + r.spentKop + '|' + r.avgRideKop()}">
            <td th:text="${r.customer()}"></td><td class="text-end" th:text="${r.rides}"></td>
            <td class="text-end" th:text="${@fmt.uah(r.spentKop)}"></td><td class="text-end" th:text="${@fmt.uah(r.avgRideKop())}"></td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
