spring.application.name=rental-token-auth
server.port=8080
# Не віддавати деталі помилок клієнту
server.error.include-message=never
server.error.include-stacktrace=never
# Секрет підпису береться зі змінної середовища JWT_SECRET (base64, від 32 байт).
# У репозиторії секрету немає; якщо змінну не задано, при запуску генерується випадковий ключ.
app.jwt.secret=${JWT_SECRET:}
# Файл журналу невдалих спроб
app.audit.file=logs/auth-failures.log
