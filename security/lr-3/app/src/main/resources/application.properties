spring.application.name=rental-validation
server.port=8080

# Підключення до БД: значення за замовчуванням для docker compose, перевизначаються змінними середовища
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rental?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:rental_app}
spring.datasource.password=${DB_PASSWORD:rental_app_pass}

# Обмеження розміру вхідних даних (захист від переповнення й DoS): тіла запитів і форми до 16 КБ
app.max-body-bytes=16384
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=64KB
server.tomcat.max-http-response-header-size=8KB
server.max-http-request-header-size=8KB
spring.servlet.multipart.enabled=false

# Помилки без службових подробиць
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=false

server.servlet.encoding.force=true
spring.thymeleaf.cache=false
spring.jpa.open-in-view=false
server.servlet.session.tracking-modes=cookie
