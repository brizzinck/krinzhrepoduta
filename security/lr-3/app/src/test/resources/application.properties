# Тести працюють із вбудованою БД у режимі MySQL: не потрібен запущений контейнер
spring.datasource.url=jdbc:h2:mem:rental-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql
spring.thymeleaf.cache=false
app.max-body-bytes=16384
server.error.include-message=never
server.error.include-stacktrace=never
