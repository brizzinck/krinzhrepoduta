# Навчальний стенд ЛР 3: MySQL 8 + застосунок у Docker.
# Запуск:  docker compose up -d --build   (профіль vuln вмикає навмисно вразливі демо-сторінки)
# Зупинка: docker compose down -v
services:
  db:
    image: mysql:8
    container_name: rental_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_lab_pass
      MYSQL_DATABASE: rental
      MYSQL_USER: rental_app
      MYSQL_PASSWORD: rental_app_pass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -prental_app_pass -urental_app --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  app:
    image: maven:3.9-eclipse-temurin-21
    container_name: rental_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/rental?useUnicode=true&characterEncoding=UTF-8
      DB_USER: rental_app
      DB_PASSWORD: rental_app_pass
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-vuln}
    volumes:
      - ./target/app.jar:/opt/app.jar:ro
    command: ["java", "-jar", "/opt/app.jar"]
    ports:
      - "127.0.0.1:8080:8080"
